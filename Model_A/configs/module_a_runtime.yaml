# Module A runtime config. Web layer reads this config; runtime flags are injected by defense.runtime.config.
inference:
  model_family: yolov5
  backend: tensorrt
  device: cuda:0
  half: true
  confidence: 0.25
  image_size: 640
  warmup_frames: 4
  artifacts:
    engine:
      - baseline_training/runs/baseline_yolov5/weights/best_fp16_640.engine
      - baseline_training/runs/baseline_yolov5/weights/best.engine
      - models/best_fp16_640.engine
      - models/best.engine
    onnx:
      - baseline_training/runs/baseline_yolov5/weights/best.onnx
      - models/best.onnx
    pytorch:
      - baseline_training/runs/baseline_yolov5/weights/best.pt
      - models/best.pt

module_a:
  require_gpu: true
  device: cuda:0
  frame_size: 640
  grid_roi_count: 4
  use_grid_when_no_roi: true
  emit_roi_details: false
  emit_roi_texture_details: false
  emit_roi_temporal_details: false
  emit_roi_motion_details: false

  lbp_radius: 3
  temporal_threshold: 0.25
  temporal_grid_size: 16
  temporal_persistence_frames: 2
  temporal_adaptive_baseline: true
  temporal_adaptive_multiplier: 2.0
  keyframe_interval: 3
  light_flow_enabled: true
  light_flow_interval: 3
  light_flow_temporal_candidate: 0.025
  light_flow_local_temporal_candidate: 0.18
  static_image_enabled: true
  static_image_interval: 4
  static_image_temporal_candidate: 0.015
  static_image_local_temporal_candidate: 0.10

  roi_min_confidence: 0.24
  roi_margin: 10
  roi_target_labels: [person, helmet, head]
  roi_stabilize_overlaps_enabled: true
  roi_stabilize_same_label_iou: 0.50
  roi_stabilize_head_helmet_iou: 0.18
  roi_stabilize_head_helmet_center_distance: 0.055
  temporal_detector_reuse_threshold: 0.008
  temporal_detector_reuse_max_gap: 1

  natural_exposure_suppression_enabled: true
  natural_exposure_max_ratio: 0.18
  natural_exposure_max_light_flow: 0.35
  natural_exposure_max_motion_score: 1.01

  p_adv_threshold: 0.55
  p_adv_display_alpha: 0.28
  a3b_display_alpha: 0.28
  alert_window: 5
  alert_trigger_count: 3

runtime:
  capture_queue_size: 1
  result_queue_size: 1
  preview_fps: 25
  preview_render_fps: 25
  preview_max_side: 960
  preview_never_wait_for_detection: true
  backend_source_pipeline: true
  process_fps_cap: 15
  detector_process_fps_cap: 15
  detector_queue_policy: latest_only
  overlay_lookahead_s: 0.35
  overlay_match_window_ms: 180
  overlay_hold_ms: 550
  overlay_interpolate_ms: 400
  overlay_max_age_ms: 950
  evidence_enabled: true
  evidence_pre_frames: 12
  evidence_post_frames: 18
  evidence_fps: 15
  jpeg_quality: 82

ppe_tracking:
  enabled: true
  iou_match_threshold: 0.30
  max_missed_frames: 10
  max_missed_ms: 700
  min_track_hits: 1
  hold_last_box: true
  smooth_alpha: 0.82
  show_held_boxes: true

a3b:
  enabled: true
  observed_threshold: 0.42
  trigger_threshold: 0.62
  strong_single_frame_threshold: 0.78
  observed_only_warning_threshold: 0.50
  observed_only_track_threshold: 0.50
  observed_only_source_keywords:
    - 视频中出现干扰视频
  trigger_source_keywords:
    - 视频中出现干扰视频
  window_size: 12
  min_window_hits: 3
  observed_only_min_window_hits: 3
  min_consecutive_hits: 2
  decay: 0.88
  max_gap_frames: 5
  trigger_hold_frames: 5
  allow_soft_trigger: true
  allow_single_strong_trigger: true
  allow_window_accumulated_trigger: true
  allow_observed_only_warning: true

profiles:
  desktop_rtx:
    inference:
      backend: tensorrt
      device: cuda:0
      half: true
      confidence: 0.25
    module_a:
      require_gpu: true
      device: cuda:0
      light_flow_interval: 3
      static_image_interval: 3
    runtime:
      preview_fps: 25
      process_fps_cap: 15
      overlay_match_window_ms: 180
      overlay_hold_ms: 550
      overlay_interpolate_ms: 400
      overlay_max_age_ms: 950
      overlay_lookahead_s: 0.35

  desktop_debug_onnx:
    inference:
      backend: onnx
      device: cuda:0
      half: true
      confidence: 0.25
    module_a:
      require_gpu: true
      device: cuda:0
      light_flow_interval: 3
      static_image_interval: 4
    runtime:
      preview_fps: 20
      process_fps_cap: 12
      overlay_lookahead_s: 0.35

  edge_fast:
    inference:
      backend: onnx
      device: cuda:0
      half: true
      confidence: 0.30
    module_a:
      require_gpu: true
      device: cuda:0
      emit_roi_details: false
      light_flow_interval: 5
      static_image_interval: 5
      temporal_detector_reuse_threshold: 0.012
      temporal_detector_reuse_max_gap: 2
    runtime:
      preview_fps: 15
      process_fps_cap: 8
      overlay_lookahead_s: 0.45
      capture_queue_size: 1

  cpu_smoke:
    inference:
      backend: onnx
      device: cpu
      half: false
      confidence: 0.35
    module_a:
      require_gpu: false
      device: cpu
      light_flow_enabled: false
      static_image_enabled: false
    runtime:
      preview_fps: 8
      process_fps_cap: 8
      overlay_lookahead_s: 0.45

  empty_smoke:
    inference:
      backend: onnx
      device: cpu
      half: false
      confidence: 0.35
    module_a:
      require_gpu: false
      device: cpu
      light_flow_enabled: false
      static_image_enabled: false
    runtime:
      allow_empty_backend: true
      evidence_enabled: false
      preview_fps: 5
      process_fps_cap: 5
      overlay_lookahead_s: 0.45

  high_quality:
    inference:
      backend: tensorrt
      device: cuda:0
      half: true
      confidence: 0.25
      image_size: 640
    module_a:
      require_gpu: true
      device: cuda:0
      light_flow_interval: 2
      static_image_interval: 3
    runtime:
      preview_fps: 25
      preview_render_fps: 25
      process_fps_cap: 15
      detector_process_fps_cap: 15

  balanced:
    inference:
      backend: onnx
      device: cuda:0
      half: true
      confidence: 0.28
      image_size: 640
    module_a:
      require_gpu: true
      device: cuda:0
      light_flow_interval: 3
      static_image_interval: 4
    runtime:
      preview_fps: 25
      preview_render_fps: 25
      process_fps_cap: 12
      detector_process_fps_cap: 12

  low_power:
    inference:
      backend: onnx
      device: cuda:0
      half: true
      confidence: 0.30
      image_size: 512
    module_a:
      require_gpu: true
      device: cuda:0
      emit_roi_details: false
      emit_roi_texture_details: false
      emit_roi_temporal_details: false
      emit_roi_motion_details: false
      light_flow_interval: 6
      static_image_interval: 8
      temporal_detector_reuse_threshold: 0.015
      temporal_detector_reuse_max_gap: 3
    runtime:
      preview_fps: 25
      preview_render_fps: 20
      process_fps_cap: 6
      detector_process_fps_cap: 6
      detector_queue_policy: latest_only
      overlay_lookahead_s: 0.45
